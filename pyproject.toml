[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = [
    "**/*.ipynb",
    "segmentation_results/hippocampus.py",
]

[tool.ruff.lint.per-file-ignores]
"Confidence_Intervals/*.py" = [
    "E402",
    "E712",
    "E721",
    "E741",
    "F841",
]
"Latex_Generator.py" = ["F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
