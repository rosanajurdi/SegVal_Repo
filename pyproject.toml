[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segval"
version = "0.0.0"
description = "Research code for confidence intervals in medical image segmentation validation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
reporting = [
    "latextable",
    "matplotlib",
    "seaborn",
    "texttable",
    "xlsxwriter",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = [
    "**/*.ipynb",
    "segmentation_results/hippocampus.py",
]

[tool.ruff.lint.per-file-ignores]
"Confidence_Intervals/*.py" = [
    "E402",
    "E712",
    "E721",
    "E741",
    "F841",
]
"Latex_Generator.py" = ["F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
